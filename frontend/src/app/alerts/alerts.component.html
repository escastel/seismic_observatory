@if (visible().length > 0) {
  <div class="alerts">
    @for (alert of visible(); track alert.id) {
      <div class="alert" [class]="'alert-' + alert.kind" [attr.role]="alert.role" [attr.data-kind]="alert.kind">
        <svg class="alert-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          @switch (alert.kind) {
            @case ('error') {
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            }
            @case ('warning') {
              <path d="M12 3L22 20H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
              <path d="M12 10v5M12 17.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            }
            @case ('info') {
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M12 11v6M12 7.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            }
            @case ('success') {
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            }
          }
        </svg>
        <span class="alert-text"><span class="visually-hidden">{{ label(alert.kind) }}: </span>{{ alert.text }}</span>
        @if (alert.kind !== 'error') {
          <button type="button" class="alert-close" aria-label="Cerrar aviso" (click)="dismiss(alert.id)">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        }
      </div>
    }
  </div>
}
