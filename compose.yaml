services:
  postgres:
    image: postgis/postgis:15-3.5
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - observatorio

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-terremotos_raw}
      KAFKA_REPLAY_TOPIC: ${KAFKA_REPLAY_TOPIC:-terremotos_replay}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic \"$${KAFKA_RAW_TOPIC}\" --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic \"$${KAFKA_REPLAY_TOPIC}\" --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server localhost:9092 --list | grep -Fxq \"$${KAFKA_RAW_TOPIC}\" && kafka-topics --bootstrap-server localhost:9092 --list | grep -Fxq \"$${KAFKA_REPLAY_TOPIC}\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - observatorio

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./db/seeds:/data/seeds:ro
    networks:
      - observatorio

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./frontend/public/datos/paises.geojson:/data/paises.geojson:ro
      - ./db/seeds:/data/seeds:ro
    networks:
      - observatorio

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - observatorio

volumes:
  postgres_data:

networks:
  observatorio:
    driver: bridge
